<div class="h2 mt-4">Images from "recorded" Predator games</div>
<div class="grid justify-items-center">
    <div *ngFor="let img of images">
        <div class="mx-2 my-4">
            <a class="w-1/5" [href]=img.url target="_blank">
                <img [src]="img.url" >
            </a>
        </div>
    </div>
</div>

<img src="../../../../assets/user-img/add_user.png" class="mx-auto">
<form class="mb-4" [formGroup]="service.formModel" autocomplete="off" (submit)="onSubmit()">
  <div class="mt-2">
    <label>Username</label>
    <input class="form-control" formControlName="UserName">
    <label class="text-danger" *ngIf="service.formModel.get('UserName')!.touched && service.formModel.get('UserName')!.errors?.['required']">This field is mandatory.</label>
  </div>
  <div formGroupName="Passwords">
    <div class="mt-2">
      <label>Password</label>
      <input type="password" class="form-control" formControlName="Password">
      <label class="text-danger" *ngIf="service.formModel.get('Passwords.Password')!.touched && service.formModel.get('Passwords.Password')!.errors?.['required']">This field is mandatory.</label>
      <label class="text-danger" *ngIf="service.formModel.get('Passwords.Password')!.touched && service.formModel.get('Passwords.Password')!.errors?.['minlength']">Minimum 3 characters required.</label>
    </div>
    <div class="mt-2">
      <label>Confirm Password</label>
      <input type="password" class="form-control" formControlName="ConfirmPassword">
      <label class="text-danger" *ngIf="service.formModel.get('Passwords.ConfirmPassword')!.touched && service.formModel.get('Passwords.ConfirmPassword')!.errors?.['required']">This field is mandatory.</label>
      <label class="text-danger" *ngIf="service.formModel.get('Passwords.ConfirmPassword')!.touched && service.formModel.get('Passwords.ConfirmPassword')!.errors?.['passwordMismatch']">Confirm Password does not match Password.</label>
    </div>
  </div>
  <div class="form-row">
    <div class="text-center">
      <button type="submit" class="text-green-400 btn btn-lg" [disabled]="!service.formModel.valid">Register</button>
    </div>
  </div>
</form>
